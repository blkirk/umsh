[package]
name = "umsh-ulcp-simdev"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Simulated ULCP device: the production device session behind an in-memory link"

[dependencies]
umsh-core = { path = "../umsh-core" }
umsh-crypto = { path = "../umsh-crypto", features = ["software-crypto"] }
umsh-gnss = { path = "../umsh-gnss" }
umsh-ulcp = { path = "../umsh-ulcp" }
umsh-ulcp-device = { path = "../umsh-ulcp-device", features = ["wifi"] }
# Host implementation of critical-section for the DutyLedger's blocking
# mutex; firmware images provide theirs via nrf-mpsl.
critical-section = { version = "1", features = ["std"] }
rand = { workspace = true, optional = true, features = ["std", "thread_rng", "sys_rng"] }
tokio = { version = "1", optional = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
umsh-lan-bearer = { path = "../umsh-lan-bearer", optional = true, features = ["tokio"] }

[features]
# A file-backed platform for a real soft device on a host.
host = ["dep:rand"]
# A LAN virtual radio: a host soft device whose PHY is the LAN bearer.
lan = ["host", "dep:tokio", "dep:umsh-lan-bearer"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
